<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Blank</title>
        <link rel="stylesheet" crossorigin href="BattleHitsHeaderView.css" defer />
    </head>
    <body>
        <div id="root">
            <div class="HeaderWrapper">
                <div class="HeaderContainer">
                    <div class="TabsNavigation">
                        <div class="HorizontalTabs HorizontalTabsBase HorizontalTabsBaseThemePrimary" data-name="Tabs">
                            <div class="HorizontalTabsOuterBorder TabsNavigationOuterBorder">
                                <div class="HorizontalTabsOuterBorderImage"></div>
                                <div class="HorizontalTabsMainBorder TabsNavigationMainBorder">
                                    <div class="HorizontalTabsMainBorderImage"></div>
                                    <div class="HorizontalTabsContent TabsNavigationContent">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="SettingsButton">
                        <div class="HorizontalTabs HorizontalTabsBase HorizontalTabsBaseThemePrimary">
                            <div class="HorizontalTabsOuterBorder TabsNavigationOuterBorder">
                                <div class="HorizontalTabsOuterBorderImage"></div>
                                <div class="HorizontalTabsMainBorder TabsNavigationMainBorder">
                                    <div class="HorizontalTabsMainBorderImage"></div>
                                    <div class="HorizontalTabsContent">
                                        <div class="Tab TabBase TabBaseThemePrimary TabBaseInactive">
                                            <div class="TabBackground"></div>
                                            <div class="TabBackgroundPattern"></div>
                                            <div class="TabBorder"></div>
                                            <div class="TabInnerBorderImage"></div>
                                            <div class="TabContent">
                                                <div class="SettingsButtonImage"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script
            type="module"
            crossorigin
            src="BattleHitsHeaderView.js"
            defer
        ></script>
    </body>
</html>
